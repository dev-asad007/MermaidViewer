name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about updated pages
        continue-on-error: true
        run: |
          curl --fail-with-body --retry 3 \
            --header "Content-Type: application/json; charset=utf-8" \
            --data '{"host":"dev-asad007.github.io","key":"a17f0e4c9b2d6f813e5a7c4d0b9e2f68","keyLocation":"https://dev-asad007.github.io/MermaidViewer/a17f0e4c9b2d6f813e5a7c4d0b9e2f68.txt","urlList":["https://dev-asad007.github.io/MermaidViewer/","https://dev-asad007.github.io/MermaidViewer/guide.html","https://dev-asad007.github.io/MermaidViewer/examples.html","https://dev-asad007.github.io/MermaidViewer/privacy.html"]}' \
            https://api.indexnow.org/indexnow
